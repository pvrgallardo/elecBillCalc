<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Bill Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

<div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">

    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 md:p-8 text-white">
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight">⚡ Electric Bill Calculator</h1>
        <p class="text-blue-100 mt-1 text-sm md:text-base">Fully synchronized with your spreadsheet logic and formulas.</p>
    </div>

    <div class="p-6 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- INPUTS -->
        <div class="lg:col-span-1 space-y-3">
            <input id="invoiceNo" type="text" class="border p-2 w-full">
            <input id="billingMonth" type="month" class="border p-2 w-full">
            <input id="transDate" type="date" class="border p-2 w-full">
            <input id="dueDate" type="date" class="border p-2 w-full">
            <input id="periodFrom" type="date" class="border p-2 w-full">
            <input id="periodTo" type="date" class="border p-2 w-full">

            <input id="totalAmount" type="number" class="border p-2 w-full">
            <input id="totalKw" type="number" class="border p-2 w-full">

            <button onclick="clearAllInputs()" class="bg-red-400 text-white p-2 w-full">Clear</button>
        </div>

        <!-- TABLE -->
        <div class="lg:col-span-2">
            <table class="w-full border text-sm">
                <thead>
                <tr class="bg-gray-100">
                    <th>Tenant</th>
                    <th>Current</th>
                    <th>Previous</th>
                    <th>Total</th>
                    <th>%</th>
                    <th>Cost</th>
                </tr>
                </thead>
                <tbody id="tenantRows"></tbody>

                <tfoot>
                <tr>
                    <td>Subtotal</td>
                    <td colspan="2"></td>
                    <td id="subtotalKw"></td>
                    <td></td>
                    <td id="subtotalCost"></td>
                </tr>

                <tr>
                    <td colspan="3">Total kW Excess (E): (B - A)</td>
                    <td id="excessKw">0</td>
                    <td colspan="2"></td>
                </tr>
                </tfoot>
            </table>
        </div>

    </div>
</div>

<script>
const initialTenants = [
    { name: "Mama", prev: 1128.5, curr: 1256.1 },
    { name: "Vhal", prev: 1664, curr: 1893.7 },
    { name: "Liza", prev: 1602.3, curr: 2016.8 },
    { name: "Erwin", prev: 69.9, curr: 83.6 }
];

let summaryText = "";

/* =========================
   LOCALSTORAGE (ONLY ADDITION)
========================= */
const STORAGE_KEY = "electricBillInputs";

function saveInputs() {
    const data = {};
    document.querySelectorAll("input").forEach(i => {
        data[i.id] = i.value;
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadInputs() {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved) return;

    Object.keys(saved).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = saved[id];
    });
}

/* =========================
   INIT (UNCHANGED)
========================= */
function initApp() {
    const tbody = document.getElementById("tenantRows");
    tbody.innerHTML = "";

    initialTenants.forEach((t, i) => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${t.name}</td>
            <td><input id="curr-${i}" type="number" oninput="calculateBill()"></td>
            <td><input id="prev-${i}" type="number" oninput="calculateBill()"></td>
            <td id="net-${i}">0</td>
            <td id="pct-${i}">0%</td>
            <td id="cost-${i}">0</td>
        `;
        tbody.appendChild(row);
    });

    loadInputs(); // ✅ RESTORE VALUES

    document.querySelectorAll("input").forEach(i => {
        i.addEventListener("input", () => {
            calculateBill();
            saveInputs(); // ✅ SAVE ON CHANGE
        });
    });

    calculateBill();
}

/* =========================
   CALCULATION (UNCHANGED)
========================= */
function calculateBill() {
    const totalAmount = parseFloat(document.getElementById("totalAmount").value) || 0;
    const totalKw = parseFloat(document.getElementById("totalKw").value) || 0;

    const pricePerKw = totalKw ? totalAmount / totalKw : 0;

    let subtotalKw = 0;
    const nets = [];

    initialTenants.forEach((_, i) => {
        const prev = parseFloat(document.getElementById(`prev-${i}`).value) || 0;
        const curr = parseFloat(document.getElementById(`curr-${i}`).value) || 0;

        const net = Math.max(0, curr - prev);
        nets.push(net);
        subtotalKw += net;
    });

    let sumCost = 0;

    initialTenants.forEach((t, i) => {
        const net = nets[i];
        const pct = subtotalKw ? net / subtotalKw : 0;
        const cost = net * pricePerKw;

        sumCost += cost;

        document.getElementById(`net-${i}`).textContent = net.toFixed(2);
        document.getElementById(`pct-${i}`).textContent = (pct * 100).toFixed(1) + "%";
        document.getElementById(`cost-${i}`).textContent = cost.toFixed(2);
    });

    document.getElementById("subtotalKw").textContent = subtotalKw.toFixed(2);
    document.getElementById("subtotalCost").textContent = sumCost.toFixed(2);

    document.getElementById("excessKw").textContent =
        (subtotalKw - totalKw).toFixed(2);

    saveInputs(); // extra safety
}

/* =========================
   CLEAR FIX
========================= */
function clearAllInputs() {
    document.querySelectorAll("input").forEach(i => i.value = "");
    localStorage.removeItem(STORAGE_KEY);
}

window.onload = initApp;
</script>

</body>
</html>
