<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Bill Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

<div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="bg-gradient-to-r flow-root from-blue-600 to-indigo-700 p-6 md:p-8 text-white">
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight">⚡ Electric Bill Calculator</h1>
        <p class="text-blue-100 mt-1 text-sm md:text-base">Fully synchronized with your spreadsheet logic and formulas.</p>
    </div>

    <div class="p-6 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- LEFT PANEL -->
        <div class="lg:col-span-1 space-y-4 bg-slate-50 p-5 rounded-xl border border-slate-200/60">

            <h2 class="text-lg font-semibold text-slate-900 border-b border-slate-200 pb-2">Invoice Details</h2>

            <input id="invoiceNo" type="text" value="O-Example" class="w-full border p-2 rounded">
            <input id="billingMonth" type="month" value="2026-05" class="w-full border p-2 rounded">
            <input id="transDate" type="date" value="2026-05-20" class="w-full border p-2 rounded">
            <input id="dueDate" type="date" value="2026-05-31" class="w-full border p-2 rounded">
            <input id="periodFrom" type="date" value="2026-05-04" class="w-full border p-2 rounded">
            <input id="periodTo" type="date" value="2026-05-22" class="w-full border p-2 rounded">

            <input id="totalAmount" type="number" value="4626.48" class="w-full border p-2 rounded">
            <input id="totalKw" type="number" value="423" class="w-full border p-2 rounded">

            <div class="pt-4 border-t space-y-2">
                <button onclick="copyBillSummary()" class="w-full bg-emerald-600 text-white py-2 rounded">
                    Copy
                </button>

                <button onclick="shareToMessenger()" class="w-full bg-blue-600 text-white py-2 rounded">
                    Share
                </button>

                <button onclick="clearAllInputs()" class="w-full bg-slate-400 text-white py-2 rounded">
                    Clear All
                </button>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="lg:col-span-2">
            <div id="captureArea" class="bg-white p-4 rounded-xl">
                <table class="w-full text-sm border">
                    <thead>
                        <tr class="bg-slate-100">
                            <th class="p-2">Tenant</th>
                            <th>Current</th>
                            <th>Previous</th>
                            <th>Total</th>
                            <th>%</th>
                            <th>Deduct</th>
                            <th>Pay kW</th>
                            <th>Cost</th>
                        </tr>
                    </thead>
                    <tbody id="tenantRows"></tbody>
                    <tfoot>
                        <tr>
                            <td>Subtotal</td>
                            <td colspan="2"></td>
                            <td id="subtotalKw"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td id="subtotalCost"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const initialTenants = [
    { name: "Mama", prev: 1128.5, curr: 1256.1 },
    { name: "Vhal", prev: 1664, curr: 1893.7 },
    { name: "Liza", prev: 1602.3, curr: 2016.8 },
    { name: "Erwin", prev: 69.9, curr: 83.6 }
];

let summaryText = "";

/* =========================
   LOCAL STORAGE (ONLY ADDITION)
========================= */
const STORAGE_KEY = "electricBillInputs";

function saveInputs() {
    const data = {};
    document.querySelectorAll("input").forEach(i => {
        data[i.id] = i.value;
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadInputs() {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved) return;

    Object.keys(saved).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = saved[id];
    });
}

/* =========================
   INIT (UNCHANGED LOGIC)
========================= */
function initApp() {
    const tbody = document.getElementById("tenantRows");
    tbody.innerHTML = "";

    initialTenants.forEach((t, i) => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${t.name}</td>
            <td><input id="curr-${i}" type="number" value="${t.curr}" oninput="calculateBill()"></td>
            <td><input id="prev-${i}" type="number" value="${t.prev}" oninput="calculateBill()"></td>
            <td id="net-${i}">0</td>
            <td id="pct-${i}">0%</td>
            <td id="deduct-${i}">0</td>
            <td id="paykw-${i}">0</td>
            <td id="cost-${i}">0</td>
        `;
        tbody.appendChild(row);
    });

    loadInputs(); // ✅ ONLY ADDITION

    document.querySelectorAll("input").forEach(i => {
        i.addEventListener("input", () => {
            calculateBill();
            saveInputs(); // ✅ ONLY ADDITION
        });
    });

    calculateBill();
}

/* =========================
   YOUR ORIGINAL CALCULATION (UNCHANGED)
========================= */
function calculateBill() {
    const totalAmount = parseFloat(document.getElementById("totalAmount").value) || 0;
    const totalKwInvoice = parseFloat(document.getElementById("totalKw").value) || 0;

    const pricePerKw = totalKwInvoice ? totalAmount / totalKwInvoice : 0;

    let subtotalKw = 0;
    const nets = [];

    initialTenants.forEach((_, i) => {
        const prev = parseFloat(document.getElementById(`prev-${i}`).value) || 0;
        const curr = parseFloat(document.getElementById(`curr-${i}`).value) || 0;
        const net = Math.max(0, curr - prev);
        nets.push(net);
        subtotalKw += net;
    });

    let sumCost = 0;

    initialTenants.forEach((t, i) => {
        const net = nets[i];
        const pct = subtotalKw ? net / subtotalKw : 0;
        const cost = net * pricePerKw;

        sumCost += cost;

        document.getElementById(`net-${i}`).textContent = net.toFixed(2);
        document.getElementById(`pct-${i}`).textContent = (pct * 100).toFixed(1) + "%";
        document.getElementById(`cost-${i}`).textContent = cost.toFixed(2);
    });

    document.getElementById("subtotalKw").textContent = subtotalKw.toFixed(2);
    document.getElementById("subtotalCost").textContent = sumCost.toFixed(2);

    saveInputs(); // optional safety save
}

/* =========================
   ACTIONS (UNCHANGED)
========================= */
function copyBillSummary() {
    navigator.clipboard.writeText(summaryText);
    alert("Copied!");
}

function shareToMessenger() {
    html2canvas(document.getElementById("captureArea")).then(canvas => {
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = "bill.png";
        a.click();
        window.open("https://www.messenger.com/", "_blank");
    });
}

/* ONLY FIXED CLEAR FUNCTION */
function clearAllInputs() {
    document.querySelectorAll("input").forEach(i => i.value = "");
    localStorage.removeItem(STORAGE_KEY);
    calculateBill();
}

window.onload = initApp;
</script>

</body>
</html>
