<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electric Bill Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
body { font-family: 'Inter', sans-serif; }
</style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

<div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">

<div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 md:p-8 text-white">
<h1 class="text-2xl md:text-3xl font-bold">⚡ Electric Bill Calculator</h1>
</div>

<div class="p-6 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

<!-- LEFT -->
<div class="lg:col-span-1 space-y-3">

<input id="invoiceNo" placeholder="Invoice No" class="input">
<input id="billingMonth" type="month" class="input">
<input id="transDate" type="date" class="input">
<input id="dueDate" type="date" class="input">
<input id="periodFrom" type="date" class="input">
<input id="periodTo" type="date" class="input">

<input id="totalAmount" type="number" placeholder="Total Amount" class="input">
<input id="totalKw" type="number" placeholder="Total kW" class="input">

<button onclick="copyBillSummary()">Copy</button>
<button onclick="shareToMessenger()">Share</button>
<button onclick="clearAllInputs()">Clear All</button>

<p class="font-bold text-indigo-600">
Price/kW: <span id="pricePerKw">0</span>
</p>

</div>

<!-- RIGHT -->
<div class="lg:col-span-2">

<div id="captureArea">

<table class="w-full">
<thead>
<tr>
<th>Tenant</th>
<th>Current</th>
<th>Previous</th>
<th>Usage</th>
<th>%</th>
<th>Cost</th>
</tr>
</thead>

<tbody id="tenantRows"></tbody>
</table>

</div>

</div>

</div>
</div>

<script>

const STORAGE_KEY = "electric-bill-data";

const initialTenants = [
{ name: "Mama", prev: 1128.5, curr: 1256.1 },
{ name: "Vhal", prev: 1664, curr: 1893.7 },
{ name: "Liza", prev: 1602.3, curr: 2016.8 },
{ name: "Erwin", prev: 69.9, curr: 83.6 }
];

let summaryText = "";

/* =========================
LOCAL STORAGE
========================= */

function saveToLocalStorage() {

const data = {
invoiceNo: invoiceNo.value,
billingMonth: billingMonth.value,
transDate: transDate.value,
dueDate: dueDate.value,
periodFrom: periodFrom.value,
periodTo: periodTo.value,
totalAmount: totalAmount.value,
totalKw: totalKw.value,

tenants: initialTenants.map((_, i) => ({
curr: document.getElementById(`curr-${i}`).value,
prev: document.getElementById(`prev-${i}`).value
}))
};

localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadFromLocalStorage() {

const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
if (!data) return;

invoiceNo.value = data.invoiceNo || "";
billingMonth.value = data.billingMonth || "";
transDate.value = data.transDate || "";
dueDate.value = data.dueDate || "";
periodFrom.value = data.periodFrom || "";
periodTo.value = data.periodTo || "";
totalAmount.value = data.totalAmount || "";
totalKw.value = data.totalKw || "";

if (data.tenants) {
data.tenants.forEach((t, i) => {
document.getElementById(`curr-${i}`).value = t.curr || "";
document.getElementById(`prev-${i}`).value = t.prev || "";
});
}
}

/* =========================
INIT
========================= */

function initApp() {

const tbody = document.getElementById("tenantRows");
tbody.innerHTML = "";

initialTenants.forEach((t, i) => {
tbody.innerHTML += `
<tr>
<td>${t.name}</td>
<td><input id="curr-${i}" type="number" oninput="onChange()"></td>
<td><input id="prev-${i}" type="number" oninput="onChange()"></td>
<td id="u-${i}"></td>
<td id="p-${i}"></td>
<td id="c-${i}"></td>
</tr>
`;
});

loadFromLocalStorage();
calculateBill();
}

/* =========================
AUTO SAVE TRIGGER
========================= */

function onChange() {
calculateBill();
saveToLocalStorage();
}

/* =========================
CALCULATE
========================= */

function calculateBill() {

const total = +totalAmount.value || 0;
const kw = +totalKw.value || 0;

const price = kw ? total / kw : 0;

pricePerKw.textContent = price.toFixed(4);

let sum = 0;

const usage = initialTenants.map((_, i) => {

const curr = +document.getElementById(`curr-${i}`).value || 0;
const prev = +document.getElementById(`prev-${i}`).value || 0;

const u = Math.max(0, curr - prev);
sum += u;
return u;

});

const excess = sum - kw;

initialTenants.forEach((t, i) => {

const u = usage[i];
const pct = sum ? u / sum : 0;
const cost = (u - excess * pct) * price;

document.getElementById(`u-${i}`).textContent = u.toFixed(2);
document.getElementById(`p-${i}`).textContent = (pct * 100).toFixed(1) + "%";
document.getElementById(`c-${i}`).textContent = cost.toFixed(2);

});

summaryText = "Electric Bill Updated";
}

/* =========================
CLEAR ALL
========================= */

function clearAllInputs() {

document.querySelectorAll("input").forEach(i => i.value = "");

localStorage.removeItem(STORAGE_KEY);

calculateBill();
}

/* =========================
SHARE / COPY
========================= */

function copyBillSummary() {
navigator.clipboard.writeText(summaryText);
}

function shareToMessenger() {

html2canvas(document.getElementById("captureArea")).then(canvas => {

const a = document.createElement("a");
a.href = canvas.toDataURL();
a.download = "bill.png";
a.click();

window.open("https://messenger.com");

});

}

/* =========================
START
========================= */

window.onload = initApp;

</script>

</body>
</html>
