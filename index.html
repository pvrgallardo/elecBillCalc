<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Bill Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

<div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="bg-gradient-to-r flow-root from-blue-600 to-indigo-700 p-6 md:p-8 text-white">
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight">⚡ Electric Bill Calculator</h1>
        <p class="text-blue-100 mt-1 text-sm md:text-base">Fully synchronized with your spreadsheet logic and formulas.</p>
    </div>

    <div class="p-6 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- LEFT PANEL -->
        <div class="lg:col-span-1 space-y-4 bg-slate-50 p-5 rounded-xl border border-slate-200/60">

            <h2 class="text-lg font-semibold text-slate-900 border-b border-slate-200 pb-2">Invoice Details</h2>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-medium uppercase tracking-wider text-slate-500 mb-1">Invoice No.</label>
                    <input type="text" id="invoiceNo" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm">
                </div>

                <div>
                    <label class="block text-[10px] font-medium uppercase tracking-wider text-slate-500 mb-1">Billing Month</label>
                    <input type="month" id="billingMonth" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-medium uppercase tracking-wider text-slate-500 mb-1">Transaction Date</label>
                    <input type="date" id="transDate" class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
                </div>

                <div>
                    <label class="block text-[10px] font-medium uppercase tracking-wider text-slate-500 mb-1">Bill Due Date</label>
                    <input type="date" id="dueDate" class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-medium uppercase tracking-wider text-slate-500 mb-1">Period From</label>
                    <input type="date" id="periodFrom" class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
                </div>

                <div>
                    <label class="block text-[10px] font-medium uppercase tracking-wider text-slate-500 mb-1">Period To</label>
                    <input type="date" id="periodTo" class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
                </div>
            </div>

            <div class="pt-2">
                <label class="block text-[10px] font-medium uppercase tracking-wider text-slate-500 mb-1">Total Amount Due</label>
                <input type="number" id="totalAmount" step="0.01" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm">
            </div>

            <div>
                <label class="block text-[10px] font-medium uppercase tracking-wider text-slate-500 mb-1">Total Energy Consumption (A) [kW]</label>
                <input type="number" id="totalKw" step="0.1" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm">
            </div>

            <div class="pt-4 border-t border-slate-200 space-y-2">

                <div class="flex justify-between items-center text-sm mb-2">
                    <span class="text-slate-600 font-medium">Price per kW (G):</span>
                    <span id="pricePerKw" class="font-bold text-indigo-600 text-base">0.0000</span>
                </div>

                <button onclick="copyBillSummary()" class="w-full bg-emerald-600 text-white py-2 rounded-lg">
                    📋 Copy Text Summary
                </button>

                <button onclick="shareToMessenger()" class="w-full bg-blue-600 text-white py-2 rounded-lg">
                    📸 Save Image & Open Messenger
                </button>

                <button onclick="clearAllInputs()" class="w-full bg-slate-400 text-white py-2 rounded-lg">
                    🔄 Clear All
                </button>
            </div>
        </div>

        <!-- TABLE -->
        <div class="lg:col-span-2 space-y-6">
            <div id="captureArea" class="bg-white p-4 rounded-xl">

                <h2 class="text-lg font-semibold mb-4">Calculations Breakdown</h2>

                <div class="overflow-x-auto border rounded-xl">
                    <table class="w-full min-w-[650px] text-left">

                        <thead>
                        <tr class="bg-slate-100 text-xs">
                            <th class="p-3">Tenant</th>
                            <th class="p-2">Current</th>
                            <th class="p-2">Previous</th>
                            <th class="p-3 text-right">Total</th>
                            <th class="p-3 text-right">%</th>
                            <th class="p-3 text-right">Deduct</th>
                            <th class="p-3 text-right">kW</th>
                            <th class="p-3 text-right">Cost</th>
                        </tr>
                        </thead>

                        <tbody id="tenantRows"></tbody>

                        <tfoot>
                        <tr class="bg-slate-50">
                            <td class="p-3">Subtotal</td>
                            <td colspan="2"></td>
                            <td id="subtotalKw" class="text-right p-3">0</td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td id="subtotalCost" class="text-right p-3 text-blue-600">0</td>
                        </tr>

                        <tr class="bg-amber-50">
                            <td class="p-3" colspan="3">Excess kW</td>
                            <td id="excessKw" class="text-right p-3"></td>
                            <td colspan="4"></td>
                        </tr>
                        </tfoot>

                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const STORAGE_KEY = "electricBillState";

function saveState() {
    const data = {};
    document.querySelectorAll("input").forEach(i => data[i.id] = i.value);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;

    const data = JSON.parse(saved);

    Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = data[id];
    });
}

const initialTenants = [
    { name: "Mama" },
    { name: "Vhal" },
    { name: "Liza" },
    { name: "Erwin" }
];

let summaryText = "";

function initApp() {
    const tbody = document.getElementById("tenantRows");

    initialTenants.forEach((t, i) => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td class="p-3">${t.name}</td>
            <td class="p-2"><input id="curr-${i}" oninput="calculateBill()" class="border w-full"></td>
            <td class="p-2"><input id="prev-${i}" oninput="calculateBill()" class="border w-full"></td>
            <td id="net-${i}" class="p-3 text-right"></td>
            <td id="pct-${i}" class="p-3 text-right"></td>
            <td id="deduct-${i}" class="p-3 text-right"></td>
            <td id="paykw-${i}" class="p-3 text-right"></td>
            <td id="cost-${i}" class="p-3 text-right"></td>
        `;

        tbody.appendChild(row);
    });

    loadState();
    calculateBill();
}

function calculateBill() {
    let subtotal = 0;
    const totalKw = parseFloat(document.getElementById("totalKw").value) || 0;
    const totalAmount = parseFloat(document.getElementById("totalAmount").value) || 0;

    const price = totalKw ? totalAmount / totalKw : 0;

    initialTenants.forEach((_, i) => {
        const c = parseFloat(document.getElementById(`curr-${i}`).value) || 0;
        const p = parseFloat(document.getElementById(`prev-${i}`).value) || 0;

        const net = Math.max(0, c - p);
        subtotal += net;

        document.getElementById(`net-${i}`).textContent = net.toFixed(2);
    });

    document.getElementById("subtotalKw").textContent = subtotal.toFixed(2);
    document.getElementById("pricePerKw").textContent = price.toFixed(4);

    const excess = subtotal - totalKw;
    document.getElementById("excessKw").textContent = excess.toFixed(2);

    saveState();
}

function clearAllInputs() {
    document.querySelectorAll("input").forEach(i => i.value = "");
    localStorage.removeItem(STORAGE_KEY);
}

function copyBillSummary() {}
function shareToMessenger() {}

window.onload = initApp;
</script>

</body>
</html>
