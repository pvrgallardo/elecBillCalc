<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Bill Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

<!-- (UNCHANGED HTML ABOVE THIS POINT) -->

<script>
        const initialTenants = [
            { name: "Mama", prev: 1128.5, curr: 1256.1 },
            { name: "Vhal", prev: 1664, curr: 1893.7 },
            { name: "Liza", prev: 1602.3, curr: 2016.8 },
            { name: "Erwin", prev: 69.9, curr: 83.6 }
        ];

        let summaryText = "";
        const STORAGE_KEY = "electricBillState"; // ✅ ADDED

        function saveState() { // ✅ ADDED
            const data = {};

            document.querySelectorAll("input").forEach(input => {
                data[input.id] = input.value;
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadState() { // ✅ ADDED
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;

            const data = JSON.parse(saved);

            setTimeout(() => {
                Object.keys(data).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = data[id];
                });

                calculateBill();
            }, 0);
        }

        function initApp() {
            const tbody = document.getElementById("tenantRows");
            tbody.innerHTML = "";

            initialTenants.forEach((tenant, idx) => {
                const row = document.createElement("tr");
                row.className = "hover:bg-slate-50/80 transition-colors";
                row.innerHTML = `
                    <td class="p-3 font-medium text-slate-900">${tenant.name}</td>
                    <td class="p-1.5">
                        <input type="number" id="curr-${idx}" oninput="calculateBill()" class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-xs focus:bg-white focus:outline-none focus:border-blue-500">
                    </td>
                    <td class="p-1.5">
                        <input type="number" id="prev-${idx}" oninput="calculateBill()" class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-xs focus:bg-white focus:outline-none focus:border-blue-500">
                    </td>
                    <td id="net-${idx}" class="p-3 text-right font-mono text-xs text-slate-600">0.00</td>
                    <td id="pct-${idx}" class="p-3 text-right font-mono text-xs text-slate-600">0.0%</td>
                    <td id="deduct-${idx}" class="p-3 text-right font-mono text-xs text-red-600">0.00</td>
                    <td id="paykw-${idx}" class="p-3 text-right font-mono text-xs text-slate-600">0.00</td>
                    <td id="cost-${idx}" class="p-3 text-right font-semibold font-mono text-slate-900">0.00</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById("totalAmount").addEventListener("input", calculateBill);
            document.getElementById("totalKw").addEventListener("input", calculateBill);
            document.getElementById("invoiceNo").addEventListener("input", calculateBill);
            document.getElementById("billingMonth").addEventListener("input", calculateBill);
            document.getElementById("transDate").addEventListener("input", calculateBill);
            document.getElementById("dueDate").addEventListener("input", calculateBill);
            document.getElementById("periodFrom").addEventListener("input", calculateBill);
            document.getElementById("periodTo").addEventListener("input", calculateBill);

            loadState(); // ✅ ADDED

            calculateBill();
        }

        function calculateBill() {
            const totalAmount = parseFloat(document.getElementById("totalAmount").value) || 0;
            const totalKw = parseFloat(document.getElementById("totalKw").value) || 0;

            const pricePerKw = totalKw > 0 ? (totalAmount / totalKw) : 0;
            document.getElementById("pricePerKw").textContent = pricePerKw.toFixed(4);

            let subtotalKw = 0;

            const tenantConsumptions = initialTenants.map((_, idx) => {
                const prev = parseFloat(document.getElementById(`prev-${idx}`).value) || 0;
                const curr = parseFloat(document.getElementById(`curr-${idx}`).value) || 0;
                const net = Math.max(0, curr - prev);
                subtotalKw += net;
                return net;
            });

            document.getElementById("subtotalKw").textContent = subtotalKw.toFixed(2);

            const excessKw = subtotalKw - totalKw;
            document.getElementById("excessKw").textContent = excessKw.toFixed(2);

            let sumCost = 0;
            let sumPercent = 0;

            initialTenants.forEach((tenant, idx) => {
                const netKw = tenantConsumptions[idx];
                const pct = subtotalKw > 0 ? (netKw / subtotalKw) : 0;
                const deduct = excessKw * pct;
                const paymentKw = netKw - deduct;
                const tenantCost = paymentKw * pricePerKw;

                sumCost += tenantCost;
                sumPercent += pct;

                document.getElementById(`net-${idx}`).textContent = netKw.toFixed(2);
                document.getElementById(`pct-${idx}`).textContent = `${(pct * 100).toFixed(1)}%`;
                document.getElementById(`deduct-${idx}`).textContent = deduct.toFixed(2);
                document.getElementById(`paykw-${idx}`).textContent = paymentKw.toFixed(2);
                document.getElementById(`cost-${idx}`).textContent = tenantCost.toFixed(2);
            });

            document.getElementById("subtotalCost").textContent = sumCost.toFixed(2);

            const invNo = document.getElementById("invoiceNo").value;
            const bMonth = document.getElementById("billingMonth").value;
            const dDate = document.getElementById("dueDate").value;
            const pFrom = document.getElementById("periodFrom").value;
            const pTo = document.getElementById("periodTo").value;

            summaryText = `⚡ Electric Bill Breakdown
Invoice: ${invNo}
Billing Month: ${bMonth}
Period: ${pFrom} to ${pTo}
Due: ${dDate}`;

            saveState(); // ✅ ADDED
        }

        function copyBillSummary() {
            navigator.clipboard.writeText(summaryText);
            alert("Text copied!");
        }

        function shareToMessenger() {
            html2canvas(document.getElementById("captureArea")).then(canvas => {
                const a = document.createElement("a");
                a.href = canvas.toDataURL("image/png");
                a.download = "electric-bill.png";
                a.click();
                window.open("https://www.messenger.com/", "_blank");
            });
        }

        function clearAllInputs() {
            document.querySelectorAll("input").forEach(i => i.value = "");
            localStorage.removeItem(STORAGE_KEY); // ✅ ADDED
        }

        window.onload = initApp;
</script>

</body>
</html>
